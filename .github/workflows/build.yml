   name: Build VST3
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: windows-2022
       steps:
         - uses: actions/checkout@v4
         - name: Configure
           run: cmake -B build -G "Visual Studio 17 2022" -A x64
         - name: Build
           run: cmake --build build --config Release
         - uses: actions/upload-artifact@v4
           with:
             name: YC-TUNE-X-VST3
             path: build/YCTuneX_artefacts/Release/VST3/
